name: template bootstrap

# Fires once, on the first push to a repository created from this template.
# Opens an issue with the setup checklist, then removes itself.
on:
  push:
    branches: [main, master]

permissions:
  contents: write
  issues: write

jobs:
  bootstrap:
    if: ${{ github.run_number == 1 && !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if already initialized
        id: check
        run: |
          if [ -f .template-initialized ] || [ ! -f .github/TEMPLATE_SETUP.md ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the setup issue
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Set up this project" --body-file .github/TEMPLATE_SETUP.md

      - name: Remove the bootstrap files
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/template-bootstrap.yml .github/TEMPLATE_SETUP.md
          git commit -m "chore: remove template bootstrap"
          git push

name: template

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: validate environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate skills, agents, adapters and hooks
        run: ./scripts/validate.sh

      - name: Adapters are in sync with AGENTS.md
        run: |
          ./scripts/sync-agent-configs.sh
          git diff --exit-code || {
            echo "::error::A generated adapter was hand-edited or is stale."
            echo "Run ./scripts/sync-agent-configs.sh and commit the result."
            exit 1; }

      - name: Shell scripts parse
        run: |
          for f in scripts/*.sh .ai/hooks/*.sh .ai/hooks/pre-commit install.sh .devcontainer/setup.sh; do
            bash -n "$f" || { echo "::error::syntax error in $f"; exit 1; }
          done

      - name: shellcheck (errors block)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error scripts/*.sh .ai/hooks/*.sh .ai/hooks/pre-commit install.sh .devcontainer/setup.sh

      - name: shellcheck (warnings, advisory)
        continue-on-error: true
        run: shellcheck -S warning scripts/*.sh .ai/hooks/*.sh .ai/hooks/pre-commit install.sh .devcontainer/setup.sh

  scaffold:
    name: scaffold a project (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [zephyr, esp-idf, freertos, stm32, nuttx, yocto, torizon, buildroot, kernel, android]
    steps:
      - uses: actions/checkout@v5

      - name: Scaffold
        run: |
          ./scripts/init-project.sh --non-interactive --force \
            --name "test-${{ matrix.stack }}" --stack "${{ matrix.stack }}" \
            --board "CI test board" --out "/tmp/proj-${{ matrix.stack }}"

      - name: The scaffolded project validates
        run: /tmp/proj-${{ matrix.stack }}/scripts/validate.sh /tmp/proj-${{ matrix.stack }}

      - name: The scaffolded project has what it needs
        run: |
          cd "/tmp/proj-${{ matrix.stack }}"
          set -e
          for f in AGENTS.md README.md .ai/README.md .template-initialized \
                   .github/workflows/checks.yml docs/decisions \
                   .antness/project.json .antness/local.json.example; do
            [ -e "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          [ ! -e CLAUDE.md ] || { echo "::error::remove CLAUDE.md so agents use AGENTS.md"; exit 1; }
          for d in .claude .codex .cursor .continue; do
            [ ! -e "$d" ] || { echo "::error::vendor config directory must not exist: $d"; exit 1; }
          done
          python3 -c "import json,sys; json.load(open('.antness/project.json'))" \
            || { echo "::error::project.json is not valid JSON"; exit 1; }
          for f in CONTRIBUTING.md .github/ISSUE_TEMPLATE templates scripts/lib; do
            [ -e "$f" ] && { echo "::error::template-only file survived: $f"; exit 1; }
          done
          grep -q "Project context — test-${{ matrix.stack }}" AGENTS.md \
            || { echo "::error::project context section missing"; exit 1; }
          echo "ok"

  tools:
    name: executable tools closed loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Runtime unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Offline agent workflow evaluations
        run: python3 -m unittest discover -s evals -v

      - name: Every tool answers --help
        run: |
          set -e
          for cli in mcu/tools/*/scripts/*_cli.py; do
            python3 "$cli" --help >/dev/null || { echo "::error::$cli --help failed"; exit 1; }
          done

      - name: Build backend detection and risk gating on a fake project
        run: |
          set -e
          ./scripts/init-project.sh --non-interactive --force \
            --name loop-test --stack freertos --board "CI board" --out /tmp/loop
          cd /tmp/loop
          mkdir -p build && echo elf > build/app.elf
          python3 mcu/tools/build/scripts/build_cli.py detect | tee /tmp/detect.json
          python3 -c "import json; d=json.load(open('/tmp/detect.json')); assert d['status']=='ok', d"
          # A flash must stop for confirmation, not proceed. Exit code 3 is the contract.
          set +e
          python3 mcu/tools/probe/scripts/probe_cli.py flash --backend openocd \
            --device STM32F407VG --file build/app.elf > /tmp/flash.json 2>&1
          code=$?
          set -e
          [ $code -eq 3 ] || { echo "::error::flash did not require confirmation (exit $code)"; cat /tmp/flash.json; exit 1; }
          echo ok

      - name: Config layer hygiene is enforced
        run: |
          set -e
          mkdir -p /tmp/lintws/.antness
          echo '{"probe": {"jlink_exe": "/opt/SEGGER/JLinkExe"}}' \
            > /tmp/lintws/.antness/project.json
          PYTHONPATH=shared/runtime python3 -c "import pathlib; from antness_runtime import config; f=config.lint_layers(pathlib.Path('/tmp/lintws')); assert f, 'lint missed an absolute tool path in project.json'; print(chr(10).join(f))"

  guards:
    name: safety guard behaviour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Destructive commands are blocked
        run: |
          set +e
          fail=0
          block() {
            ./.ai/hooks/guard-destructive-hardware.sh "$1" >/dev/null 2>&1
            [ $? -eq 2 ] || { echo "::error::not blocked: $1"; fail=1; }
          }
          allow() {
            ./.ai/hooks/guard-destructive-hardware.sh "$1" >/dev/null 2>&1
            [ $? -eq 0 ] || { echo "::error::wrongly blocked: $1"; fail=1; }
          }
          block "dd if=core-image.wic of=/dev/sda bs=4M"
          block "espefuse.py burn_efuse SECURE_BOOT_EN"
          block "nrfjprog --eraseall"
          block "fw_setenv bootcmd 'run mmcboot'"
          block "sfdisk /dev/mmcblk0 < layout.txt"
          block "rm -rf ~/yocto/sstate-cache"
          allow "west build -b verdin_imx8mp app"
          allow "bitbake core-image-minimal"
          allow "git status"
          exit $fail

      - name: Secret scan catches credentials
        run: |
          set +e
          mkdir -p /tmp/ss && cd /tmp/ss
          printf 'CONFIG_WIFI_PASSWORD="hunter2swordfish"\n' > prj.conf
          printf 'IMAGE_FEATURES += "debug-tweaks"\n' > local.conf
          "$GITHUB_WORKSPACE/.ai/hooks/secret-scan.sh" prj.conf local.conf >/dev/null 2>&1
          [ $? -ne 0 ] || { echo "::error::secret scan did not fire"; exit 1; }
          printf 'CONFIG_LOG=y\n' > clean.conf
          "$GITHUB_WORKSPACE/.ai/hooks/secret-scan.sh" clean.conf >/dev/null 2>&1
          [ $? -eq 0 ] || { echo "::error::false positive on a clean file"; exit 1; }
          echo ok
